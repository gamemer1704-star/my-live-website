<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าชมการถ่ายทอดสด - Exclusive Live Stream</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0d1117; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .card { background-color: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 32px; width: 100%; max-width: 420px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    h2 { text-align: center; margin-bottom: 24px; color: #f0f6fc; font-size: 22px; }
    .form-group { margin-bottom: 18px; }
    label { display: block; margin-bottom: 8px; font-size: 14px; color: #8b949e; }
    input[type="text"], input[type="password"] {
      width: 100%; padding: 12px 14px; border-radius: 8px; border: 1px solid #30363d; background-color: #0d1117; color: #f0f6fc; font-size: 15px; outline: none; transition: 0.2s;
    }
    input:focus { border-color: #238636; box-shadow: 0 0 0 3px rgba(35,134,54,0.3); }
    button {
      width: 100%; padding: 12px; border: none; border-radius: 8px; background-color: #238636; color: white; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; margin-top: 10px;
    }
    button:hover { background-color: #2ea043; }
    
    #live-section, #admin-section { display: none; width: 100%; max-width: 900px; text-align: center; }
    .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 12px; background: #000; margin: 20px 0; border: 1px solid #30363d; }
    .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
    .user-info { font-size: 14px; color: #8b949e; margin-bottom: 10px; }

    /* ตารางแอดมิน */
    .admin-card { background-color: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 24px; text-align: left; width: 100%; max-width: 700px; margin: 0 auto; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { padding: 12px; border-bottom: 1px solid #30363d; text-align: left; font-size: 14px; }
    th { color: #8b949e; }
    .ban-btn { background-color: #da3633; padding: 6px 12px; font-size: 13px; border-radius: 6px; width: auto; margin: 0; }
    .ban-btn:hover { background-color: #f85149; }
  </style>
</head>
<body>

  <!-- 1. หน้าฟอร์มกรอกข้อมูลเข้าชม -->
  <div id="login-card" class="card">
    <h2>🔒 เข้าชมการถ่ายทอดสด</h2>
    <form id="access-form">
      <div class="form-group">
        <label>ชื่อ - นามสกุล / ชื่อเล่น</label>
        <input type="text" id="user-name" placeholder="ระบุชื่อของคุณ" required>
      </div>
      <div class="form-group">
        <label>ชื่อผู้ใช้ X (Twitter)</label>
        <input type="text" id="user-twitter" placeholder="@your_twitter" required>
      </div>
      <div class="form-group">
        <label>รหัสลับเข้าชมไลฟ์ (4 หลัก)</label>
        <input type="password" id="secret-code" placeholder="กรอกรหัสลับ" maxlength="4" required>
      </div>
      <button type="submit">ยืนยันรหัสผ่านเพื่อเข้าชม</button>
    </form>
  </div>

  <!-- 2. หน้าชมไลฟ์สดสำหรับคนดู -->
  <div id="live-section">
    <h2>🔴 กำลังรับชมการถ่ายทอดสด</h2>
    <p class="user-info" id="welcome-user"></p>
    <div class="video-container">
      <iframe src="https://www.youtube.com/embed/BP-pdUF2YMs?autoplay=1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    </div>
  </div>

  <!-- 3. หน้าแดชบอร์ดแอดมิน (#admin) สำหรับจัดการแบน -->
  <div id="admin-section">
    <div class="admin-card">
      <h2>🛡️ ระบบจัดการแอดมิน (รายชื่อคนเข้าชม)</h2>
      <p style="color: #8b949e; font-size: 13px; margin-bottom: 15px;">คุณสามารถกดปุ่มแบนเพื่อตัดสิทธิ์ผู้ชมคนนั้นทันที</p>
      <table>
        <thead>
          <tr>
            <th>ชื่อ</th>
            <th>Twitter</th>
            <th>เวลาที่เข้า</th>
            <th>จัดการ</th>
          </tr>
        </thead>
        <tbody id="viewer-table-body">
          <!-- ข้อมูลจะโหลดขึ้นมาตรงนี้อัตโนมัติ -->
        </tbody>
      </table>
      <button style="margin-top: 20px; background-color: #30363d;" onclick="location.hash=''; location.reload();">ออกจากหน้าแอดมิน</button>
    </div>
  </div>

  <script>
    const SECRET_CODE = "1235"; 
    const SUPABASE_URL = 'https://eciqpqnpfpndyyurqhzf.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_c7FKBI_HRzR-KyBT2aYiUa_1fp28csm';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // ตรวจสอบว่าเป็นหน้าแอดมินหรือไม่ (#admin)
    window.addEventListener('load', () => {
      if (window.location.hash === '#admin') {
        document.getElementById('login-card').style.display = 'none';
        document.getElementById('admin-section').style.display = 'block';
        loadAdminViewers();
      }
    });

    // ระบบตรวจสอบสิทธิ์เมื่อผู้ชมนมเข้าชม
    document.getElementById('access-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const name = document.getElementById('user-name').value.trim();
      const twitter = document.getElementById('user-twitter').value.trim();
      const code = document.getElementById('secret-code').value.trim();

      if (code !== SECRET_CODE) {
        alert('❌ รหัสลับไม่ถูกต้อง! กรุณาลองใหม่อีกครั้ง');
        return;
      }

      try {
        // เช็กว่าโดนแบนในตาราง banned_users หรือไม่
        const { data: bannedList } = await supabaseClient
          .from('banned_users')
          .select('*')
          .eq('twitter', twitter);

        if (bannedList && bannedList.length > 0) {
          alert('🚫 ขออภัย คุณถูกระงับสิทธิ์ในการเข้าชมการถ่ายทอดสดนี้');
          return;
        }

        // บันทึกประวัติการเข้าชม
        await supabaseClient.from('viewers').insert([
          { name: name, twitter: twitter, joined_at: new Date().toISOString() }
        ]);

        // เปิดหน้าดูไลฟ์
        document.getElementById('login-card').style.display = 'none';
        document.getElementById('welcome-user').innerText = `ยินดีต้อนรับ: ${name} (${twitter})`;
        document.getElementById('live-section').style.display = 'block';

      } catch (err) {
        console.log('Error:', err);
        document.getElementById('login-card').style.display = 'none';
        document.getElementById('welcome-user').innerText = `ยินดีต้อนรับ: ${name} (${twitter})`;
        document.getElementById('live-section').style.display = 'block';
      }
    });

    // ฟังก์ชันฝั่งแอดมิน: โหลดรายชื่อคนดูทั้งหมด
    async function loadAdminViewers() {
      const tbody = document.getElementById('viewer-table-body');
      tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">กำลังโหลดข้อมูล...</td></tr>';

      try {
        const { data, error } = await supabaseClient
          .from('viewers')
          .select('*')
          .order('joined_at', { ascending: false });

        if (error) throw error;

        tbody.innerHTML = '';
        if (!data || data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">ยังไม่มีผู้เข้าชมในระบบ</td></tr>';
          return;
        }

        data.forEach(viewer => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${viewer.name}</td>
            <td>${viewer.twitter}</td>
            <td>${new Date(viewer.joined_at).toLocaleString('th-TH')}</td>
            <td><button class="ban-btn" onclick="banUser('${viewer.twitter}')">❌ แบนรายนี้</button></td>
          `;
          tbody.appendChild(tr);
        });
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color: #f85149;">เกิดข้อผิดพลาดในการโหลดข้อมูล (โปรดสร้างตาราง viewers และ banned_users ใน Supabase)</td></tr>`;
      }
    }

    // ฟังก์ชันฝั่งแอดมิน: กดแบนผู้ใช้
    async function banUser(twitter) {
      if (!confirm(`คุณต้องการแบนบัญชี ${twitter} ใช่หรือไม่?`)) return;

      try {
        // บันทึกชื่อลงตาราง banned_users
        const { error } = await supabaseClient
          .from('banned_users')
          .insert([{ twitter: twitter, reason: 'Admin Banned Live' }]);

        if (error) throw error;

        alert(`แบน ${twitter} สำเร็จเรียบร้อย!`);
        loadAdminViewers(); // โหลดรายชื่อใหม่
      } catch (err) {
        alert('เกิดข้อผิดพลาดในการแบน: ' + err.message);
      }
    }
  </script>
</body>
</html>

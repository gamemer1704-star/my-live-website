<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าชมการถ่ายทอดสด - Exclusive Live Stream</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0d1117; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .card { background-color: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 32px; width: 100%; max-width: 420px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    h2 { text-align: center; margin-bottom: 24px; color: #f0f6fc; font-size: 22px; }
    .form-group { margin-bottom: 18px; }
    label { display: block; margin-bottom: 8px; font-size: 14px; color: #8b949e; }
    input[type="text"], input[type="password"] {
      width: 100%; padding: 12px 14px; border-radius: 8px; border: 1px solid #30363d; background-color: #0d1117; color: #f0f6fc; font-size: 15px; outline: none; transition: 0.2s;
    }
    input:focus { border-color: #238636; box-shadow: 0 0 0 3px rgba(35,134,54,0.3); }
    button {
      width: 100%; padding: 12px; border: none; border-radius: 8px; background-color: #238636; color: white; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; margin-top: 10px;
    }
    button:hover { background-color: #2ea043; }
    
    .admin-link-btn { background: none; border: none; color: #8b949e; font-size: 13px; cursor: pointer; margin-top: 15px; width: 100%; text-align: center; text-decoration: underline; }
    .admin-link-btn:hover { color: #f0f6fc; }

    #live-section, #admin-login-card, #admin-section { display: none; width: 100%; }
    #live-section { max-width: 900px; text-align: center; }
    #admin-section { max-width: 700px; }
    
    .video-container { 
      position: relative; 
      padding-bottom: 56.25%; 
      height: 0; 
      overflow: hidden; 
      border-radius: 12px; 
      background: #000; 
      margin: 15px 0; 
      border: 1px solid #30363d; 
    }
    .video-container iframe { 
      position: absolute; 
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%; 
      border: 0; 
      pointer-events: none; /* ล็อกคลิปก่อนขยาย */
    }

    .custom-controls {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 15px;
    }
    .ctrl-btn {
      background-color: #238636;
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      width: auto;
      margin: 0;
    }
    .ctrl-btn:hover { background-color: #2ea043; }
    .fs-ctrl-btn { background-color: #1f6feb; }
    .fs-ctrl-btn:hover

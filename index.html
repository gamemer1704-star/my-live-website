<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>เข้าชมการถ่ายทอดสด - Exclusive Live Stream</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0d1117; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
    .card { background-color: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 24px; width: 100%; max-width: 420px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    h2 { text-align: center; margin-bottom: 20px; color: #f0f6fc; font-size: 20px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; margin-bottom: 8px; font-size: 14px; color: #8b949e; }
    input[type="text"], input[type="password"] {
      width: 100%; padding: 12px 14px; border-radius: 8px; border: 1px solid #30363d; background-color: #0d1117; color: #f0f6fc; font-size: 15px; outline: none; transition: 0.2s;
    }
    input:focus { border-color: #238636; box-shadow: 0 0 0 3px rgba(35,134,54,0.3); }
    button {
      width: 100%; padding: 12px; border: none; border-radius: 8px; background-color: #238636; color: white; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.2s; margin-top: 8px;
    }
    button:hover { background-color: #2ea043; }
    
    .admin-link-btn { background: none; border: none; color: #8b949e; font-size: 13px; cursor: pointer; margin-top: 15px; width: 100%; text-align: center; text-decoration: underline; }
    .admin-link-btn:hover { color: #f0f6fc; }

    #live-section, #admin-login-card, #admin-section { display: none; width: 100%; }
    #live-section { max-width: 900px; text-align: center; }
    #admin-section { max-width: 700px; }
    
    .video-container { 
      position: relative; 
      padding-bottom: 56.25%; 
      height: 0; 
      overflow: hidden; 
      border-radius: 12px; 
      background: #000; 
      margin: 15px 0; 
      border: 1px solid #30363d; 
    }
    
    /* ในภาวะปกติ: บล็อกการคลิกบนคลิป เพื่อไม่ให้เผลอกดหลุดไป YouTube */
    .video-container iframe { 
      position: absolute; 
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%; 
      border: 0; 
      pointer-events: none; 
    }

    /* เมื่อเข้าโหมดขยายเต็มจอ: ปลดล็อกให้กดปุ่มควบคุมล่างของ YouTube ได้ทันที */
    .video-container.is-fullscreen iframe {
      pointer-events: auto !important;
    }

    /* แผ่นใสบล็อกส่วนหัว บล็อกเฉพาะ 60px ด้านบนสุดของวิดีโอเมื่อขยายเต็มจอ */
    .top-header-blocker {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 60px;
      z-index: 100;
      background: transparent;
      display: none;
      pointer-events: auto;
    }

    .video-container.is-fullscreen .top-header-blocker {
      display: block;
    }

    .custom-controls {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }
    .ctrl-btn {
      background-color: #238636;
      color: #fff;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      flex: 1;
      min-width: 100px;
      max-width: 180px;
    }
    .ctrl-btn:hover { background-color: #2ea043; }
    .fs-ctrl-btn { background-color: #1f6feb; }
    .fs-ctrl-btn:hover { background-color: #388bfd; }
    .reload-ctrl-btn { background-color: #d97706; }
    .reload-ctrl-btn:hover { background-color: #f59e0b; }

    .user-info { font-size: 14px; color: #8b949e; margin-bottom: 5px; }
    .viewer-count { font-size: 15px; color: #58a6ff; font-weight: bold; margin-bottom: 15px; }

    .admin-card { background-color: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 24px; text-align: left; width: 100%; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { padding: 12px; border-bottom: 1px solid #30363d; text-align: left; font-size: 14px; }
    th { color: #8b949e; }
    .ban-btn { background-color: #da3633; padding: 6px 12px; font-size: 13px; border-radius: 6px; width: auto; margin: 0; }
    .ban-btn:hover { background-color: #f85149; }
  </style>
</head>
<body>

  <!-- 1. หน้าฟอร์มสำหรับคนดูทั่วไป -->
  <div id="login-card" class="card">
    <h2>🔒 เข้าชมการถ่ายทอดสด</h2>
    <form id="access-form">
      <div class="form-group">
        <label>ชื่อ - นามสกุล / ชื่อเล่น</label>
        <input type="text" id="user-name" placeholder="ระบุชื่อของคุณ" required>
      </div>
      <div class="form-group">
        <label>ชื่อผู้ใช้ X (Twitter)</label>
        <input type="text" id="user-twitter" placeholder="@your_twitter" required>
      </div>
      <div class="form-group">
        <label>รหัสลับเข้าชมไลฟ์ (4 หลัก)</label>
        <input type="password" id="secret-code" placeholder="กรอกรหัสลับ" maxlength="4" required>
      </div>
      <button type="submit">ยืนยันรหัสผ่านเพื่อเข้าชม</button>
    </form>
    <button class="admin-link-btn" onclick="showCard('admin-login-card')">🔐 สำหรับผู้ดูแลระบบ (Admin)</button>
  </div>

  <!-- 2. หน้ากรอกรหัสผ่านแอดมิน (nano1278) -->
  <div id="admin-login-card" class="card" style="display: none;">
    <h2>🛡️ เข้าสู่ระบบแอดมิน</h2>
    <form id="admin-login-form">
      <div class="form-group">
        <label>รหัสผ่านแอดมิน</label>
        <input type="password" id="admin-passcode" placeholder="กรอกรหัสแอดมิน" required>
      </div>
      <button type="submit" style="background-color: #1f6feb;">เข้าสู่หน้าจัดการ</button>
    </form>
    <button class="admin-link-btn" onclick="showCard('login-card')">← กลับไปหน้าคนดู</button>
  </div>

  <!-- 3. หน้าชมไลฟ์สดสำหรับคนดู -->
  <div id="live-section">
    <h2>🔴 กำลังรับชมการถ่ายทอดสด</h2>
    <p class="user-info" id="welcome-user"></p>
    <p class="viewer-count" id="live-viewer-count">👥 กำลังโหลดจำนวนคนดู...</p>
    
    <div class="custom-controls">
      <button class="ctrl-btn" id="play-pause-btn" onclick="togglePlay()">▶️ เริ่มเล่น</button>
      <button class="ctrl-btn reload-ctrl-btn" onclick="reloadVideo()">🔄 รีเฟรชคลิป</button>
      <button class="ctrl-btn fs-ctrl-btn" onclick="toggleFullscreen()">⛶ ขยายเต็มจอ</button>
    </div>

    <div class="video-container" id="video-box">
      <div class="top-header-blocker"></div>
      <iframe id="yt-player" src="https://www.youtube.com/embed/BP-pdUF2YMs?autoplay=0&enablejsapi=1&controls=1&modestbranding=1&rel=0&iv_load_policy=3" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    </div>
  </div>

  <!-- 4. หน้าแดชบอร์ดแอดมิน -->
  <div id="admin-section">
    <div class="admin-card">
      <h2>🛡️ แดชบอร์ดแอดมิน (รายชื่อคนเข้าชม)</h2>
      <p style="color: #8b949e; font-size: 13px; margin-bottom: 15px;" id="admin-total-count">กำลังโหลดจำนวนผู้ชม...</p>
      <table>
        <thead>
          <tr>
            <th>ชื่อ</th>
            <th>Twitter</th>
            <th>เวลาที่เข้า</th>
            <th>จัดการ</th>
          </tr>
        </thead>
        <tbody id="viewer-table-body">
        </tbody>
      </table>
      <button style="margin-top: 20px; background-color: #30363d;" onclick="location.reload();">ออกจากระบบแอดมิน</button>
    </div>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    const SECRET_CODE = "1235";      
    const ADMIN_CODE = "nano1278";   
    
    const SUPABASE_URL = 'https://eciqpqnpfpndyyurqhzf.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_c7FKBI_HRzR-KyBT2aYiUa_1fp28csm';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let player;
    let isPlaying = false;

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('yt-player', {
        events: {
          'onStateChange': onPlayerStateChange
        }
      });
    }

    function onPlayerStateChange(event) {
      const btn = document.getElementById('play-pause-btn');
      if (event.data === YT.PlayerState.PLAYING) {
        isPlaying = true;
        btn.innerHTML = "⏸️ หยุดชั่วคราว";
      } else if (event.data === YT.PlayerState.PAUSED || event.data === YT.PlayerState.ENDED) {
        isPlaying = false;
        btn.innerHTML = "▶️ เริ่มเล่น";
      }
    }

    function showCard(cardId) {
      document.getElementById('login-card').style.display = 'none';
      document.getElementById('admin-login-card').style.display = 'none';
      document.getElementById('live-section').style.display = 'none';
      document.getElementById('admin-section').style.display = 'none';
      document.getElementById(cardId).style.display = 'block';
    }

    function togglePlay() {
      if (!player || typeof player.playVideo !== 'function') return;
      if (isPlaying) {
        player.pauseVideo();
      } else {
        player.playVideo();
      }
    }

    function reloadVideo() {
      if (!player || typeof player.loadVideoById !== 'function') return;
      player.loadVideoById('BP-pdUF2YMs');
    }

    function toggleFullscreen() {
      const elem = document.getElementById('video-box');
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (elem.requestFullscreen) {
          elem.requestFullscreen();
        } else if (elem.webkitRequestFullscreen) {
          elem.webkitRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
      }
    }

    /* ใช้ JavaScript ตรวจจับการขยายจอ และสลับคลาสแบบไดนามิก */
    function handleFullscreenChange() {
      const elem = document.getElementById('video-box');
      const isFS = !!(document.fullscreenElement || document.webkitFullscreenElement);
      if (isFS) {
        elem.classList.add('is-fullscreen');
      } else {
        elem.classList.remove('is-fullscreen');
      }
    }

    document.addEventListener('fullscreenchange', handleFullscreenChange);
    document.addEventListener('webkitfullscreenchange', handleFullscreenChange);

    document.getElementById('access-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const name = document.getElementById('user-name').value.trim();
      const twitter = document.getElementById('user-twitter').value.trim();
      const code = document.getElementById('secret-code').value.trim();

      if (code !== SECRET_CODE) {
        alert('❌ รหัสลับไม่ถูกต้อง! กรุณาลองใหม่อีกครั้ง');
        return;
      }

      try {
        const { data: bannedList } = await supabaseClient
          .from('banned_users')
          .select('*')
          .eq('twitter', twitter);

        if (bannedList && bannedList.length > 0) {
          alert('🚫 ขออภัย คุณถูกระงับสิทธิ์ในการเข้าชมการถ่ายทอดสดนี้');
          return;
        }

        await supabaseClient.from('viewers').insert([
          { name: name, twitter: twitter }
        ]);

        document.getElementById('login-card').style.display = 'none';
        document.getElementById('welcome-user').innerText = `ยินดีต้อนรับ: ${name} (${twitter})`;
        document.getElementById('live-section').style.display = 'block';
        
        updateViewerCount();

      } catch (err) {
        console.log('Error:', err);
        document.getElementById('login-card').style.display = 'none';
        document.getElementById('welcome-user').innerText = `ยินดีต้อนรับ: ${name} (${twitter})`;
        document.getElementById('live-section').style.display = 'block';
      }
    });

    async function updateViewerCount() {
      try {
        const { count, error } = await supabaseClient
          .from('viewers')
          .select('*', { count: 'exact', head: true });
        
        if (!error) {
          document.getElementById('live-viewer-count').innerText = `👥 ขณะนี้มีผู้กำลังรับชมทั้งหมด ${count || 0} คน`;
        }
      } catch (e) {
        document.getElementById('live-viewer-count').innerText = `👥 กำลังรับชมสด`;
      }
    }

    document.getElementById('admin-login-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const inputCode = document.getElementById('admin-passcode').value.trim();

      if (inputCode !== ADMIN_CODE) {
        alert('❌ รหัสผ่านแอดมินไม่ถูกต้อง!');
        return;
      }

      showCard('admin-section');
      loadAdminViewers();
    });

    async function loadAdminViewers() {
      const tbody = document.getElementById('viewer-table-body');
      tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">กำลังโหลดข้อมูล...</td></tr>';

      try {
        const { data, error } = await supabaseClient
          .from('viewers')
          .select('*')
          .order('created_at', { ascending: false });

        if (error) throw error;

        document.getElementById('admin-total-count').innerText = `📊 สรุปยอดผู้เข้าชมทั้งหมด: ${data ? data.length : 0} คน`;

        tbody.innerHTML = '';
        if (!data || data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">ยังไม่มีผู้เข้าชมในระบบ</td></tr>';
          return;
        }

        data.forEach(viewer => {
          const timeStr = viewer.created_at ? new Date(viewer.created_at).toLocaleString('th-TH') : '-';
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${viewer.name || '-'}</td>
            <td>${viewer.twitter || '-'}</td>
            <td>${timeStr}</td>
            <td><button class="ban-btn" onclick="banUser('${viewer.twitter}')">❌ เตะออก / แบน</button></td>
          `;
          tbody.appendChild(tr);
        });
      } catch (err) {
        console.error(err);
        tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color: #f85149;">เกิดข้อผิดพลาด: ${err.message}</td></tr>`;
      }
    }

    async function banUser(twitter) {
      if (!confirm(`คุณต้องการแบนและเตะบัญชี ${twitter} ออกจากการรับชมใช่หรือไม่?`)) return;

      try {
        const { error } = await supabaseClient
          .from('banned_users')
          .insert([{ twitter: twitter, reason: 'Admin Kicked Live' }]);

        if (error) throw error;

        alert(`แบนบัญชี ${twitter} เรียบร้อยแล้ว!`);
        loadAdminViewers();
      } catch (err) {
        alert('เกิดข้อผิดพลาดในการแบน: ' + err.message);
      }
    }
  </script>
</body>
</html>
